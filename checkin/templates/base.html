<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR Checkin</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .green { background: #00cc44; color: white; }
    .red { background: #cc0000; color: white; }
    .btn { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; }
  </style>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }

    /* Base buttons */
    .btn {
        padding: 10px 18px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    /* SESSION BUTTON DESIGN */
    .btn-session {
        background: linear-gradient(135deg, #5A67D8, #434190);
        color: white;
        box-shadow: 0 4px 10px rgba(67, 65, 144, 0.3);
    }

    .btn-session:hover {
        background: linear-gradient(135deg, #6B75EA, #4A47A0);
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(67, 65, 144, 0.4);
    }

    .btn-session:active {
        transform: scale(0.97);
    }
</style>

</head>
<body>
  <nav>
    <a class="btn btn-session" href="{% url 'session_list' %}">
        📁 Sessions
    </a>
    <!-- <a href="{% url 'create_session' %}">Créer une session</a> -->
  </nav>
  <hr/>
  {% if messages %}
    {% for message in messages %}
      <p style="color:green">{{ message }}</p>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
